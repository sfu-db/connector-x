# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      # Check for updates to GitHub Actions every week
      interval: weekly

  # copy over from https://github.com/pola-rs/polars/blob/main/.github/dependabot.yml
  # Rust Polars
  - package-ecosystem: cargo
    directory: '/'
    schedule:
      interval: weekly
    #ignore:
    #  - dependency-name: '*'
    #    update-types: ['version-update:semver-patch']
    commit-message:
      prefix: build(rust)
      prefix-development: chore(rust)
    #labels: ['skip changelog']
    groups:
      # polars depends on polars-arrow at its own exact version, so bumping
      # either crate alone leaves two incompatible polars-arrow copies in the
      # build. Always update them in one PR.
      polars:
        patterns: ['polars', 'polars-*']

  # connectorx-python is its own Cargo workspace with its own Cargo.lock, so
  # the root entry above never touches it.
  - package-ecosystem: cargo
    directory: '/connectorx-python'
    schedule:
      interval: weekly
    commit-message:
      prefix: build(rust)
      prefix-development: chore(rust)
    groups:
      # Same reason as above: keep polars and polars-arrow in one PR, and
      # aligned with the root workspace.
      polars:
        patterns: ['polars', 'polars-*']

  # Python dependencies of connectorx-python (pyproject.toml / uv.lock).
  - package-ecosystem: uv
    directory: '/connectorx-python'
    schedule:
      interval: weekly
    commit-message:
      prefix: build(python)
      prefix-development: chore(python)
    groups:
      polars:
        patterns: ['polars', 'polars-*']
