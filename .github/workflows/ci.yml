name: ci

on:
  pull_request:
    branches:
      - main
      - prerelease
  push:
    branches:
      - main

# A newer push to the same PR makes the running checks obsolete; main pushes
# always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Debug info is most of target/'s size and nothing in CI reads it (coverage
  # uses -C instrument-coverage, not debuginfo). Smaller targets mean smaller
  # caches, which keeps the repo under the 10 GB Actions cache limit.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  # connectorx-python's release profile uses fat LTO; the Python tests only
  # need a working extension, not a fully optimised one.
  CARGO_PROFILE_RELEASE_LTO: "off"
  # Caches are saved only from pushes to main. PRs restore main's caches but
  # never write their own, so they can't evict main's entries.
  SAVE_CACHE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

# Cache keys deliberately use no secrets: fork and Dependabot PRs get no
# secrets, so a secret in the key gave them a different key from main and
# they never got a cache hit. Bump the "v1" prefix to invalidate the caches.

jobs:
  # Formatting, lints, docs, feature gates and doctests: everything that needs
  # no instrumented build. Runs in parallel with the coverage jobs.
  rust-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl postgresql-client build-essential pkg-config libssl-dev git sqlite3 libsqlite3-dev mysql-client python3 python3-pip libkrb5-dev libclang-dev
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          shared-key: linux-lint
          save-if: ${{ env.SAVE_CACHE }}

      - uses: taiki-e/install-action@just

      - name: Is the code formatted?
        run: cargo fmt --all -- --check -q

      # --all also covers connectorx-cpp (not a default member). -D warnings
      # fails the build on any new warning, including missing_docs, which both
      # crates enable in lib.rs.
      - name: Clippy linting
        run: cargo clippy --features all --all -- -D warnings

      - name: Test build docs
        run: cargo doc --no-deps --features all
        env:
          # Fail on broken doc links and malformed HTML in doc comments.
          # Missing docs are caught by the clippy step above.
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links -D rustdoc::invalid_html_tags"

      - name: Check each feature gate
        run: just test-feature-gate

      # Coverage runs --lib and --test only, so doctests were never built.
      # --locked also fails the job if Cargo.lock is out of date.
      - name: Run doctests
        run: cargo test --locked --doc --features all

  # Unit and integration coverage run as two parallel jobs. They share one
  # cache (both are llvm-cov instrumented builds of the same dependency tree);
  # only the unit job saves it.
  rust-coverage:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration]

    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl postgresql-client build-essential pkg-config libssl-dev git sqlite3 libsqlite3-dev mysql-client python3 python3-pip libkrb5-dev libclang-dev
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          shared-key: linux-coverage
          save-if: ${{ env.SAVE_CACHE == 'true' && matrix.suite == 'unit' }}

      - uses: taiki-e/install-action@just

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run ${{ matrix.suite }} tests and generate coverage
        run: |
          just coverage-${{ matrix.suite }}
          {
            echo "### Rust ${{ matrix.suite }} test coverage"
            echo '```text'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # test_db.rs leaks each testcontainers::Container (std::mem::forget), and
      # every pulled image (postgres, mysql, mssql, ...) stays on the runner's
      # disk too. Stop/remove the leaked containers (label filter matches only
      # containers testcontainers started), then prune now-unreferenced images
      # to reclaim that space before the cache is saved.
      - name: Clean up test containers and images
        if: always()
        run: |
          docker rm -f $(docker ps -aq --filter "label=org.testcontainers.managed-by=testcontainers") 2>/dev/null || true
          docker image prune -af

      - name: Upload ${{ matrix.suite }} coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov-${{ matrix.suite }}.info
          flags: ${{ matrix.suite }}-tests
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # release.yml ships wheels for Windows and macOS too, but the jobs above only
  # run on Linux. Run the unit tests (no databases needed) on those platforms
  # so a platform-specific break is caught before a release. The Intel macOS
  # runner is by far the slowest, so it only runs on pushes to main.
  rust-cross-platform:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'push' && '["windows-latest", "macos-latest", "macos-15-intel"]' || '["windows-latest", "macos-latest"]') }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          shared-key: ${{ matrix.os }}
          save-if: ${{ env.SAVE_CACHE }}

      - name: Run unit tests
        run: cargo test --lib --features all

  python:
    runs-on: ubuntu-latest
    env:
      # Force disable the GIL on free-threading because of https://github.com/sqlalchemy/sqlalchemy/discussions/13256
      PYTHON_GIL: ${{ (matrix.python-version == '3.14t' || matrix.python-version == '3.15t') && '0' || '1' }}
      # Points uv at the interpreter from setup-python (works for 3.14t too).
      UV_PYTHON: ${{ matrix.python-version }}
    # Note: No 'container' - we run directly on the VM to access Docker for Testcontainers
    strategy:
      fail-fast: false
      matrix:
        # 3.15t is left out: polars only ships abi3 wheels, which free-threaded
        # builds can't load, and psycopg2-binary/oracledb/cryptography have no
        # cp315t wheels either.
        python-version: ["3.14", "3.14t", "3.15"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
            python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl postgresql-client build-essential pkg-config libssl-dev openssl git sqlite3 libsqlite3-dev mysql-client libmysqlclient-dev libkrb5-dev libclang-dev libffi-dev libaio1t64

          # Create symlink for libaio.so.1 (Oracle expects libaio.so.1, but Ubuntu 24.04 provides libaio.so.1t64)
          sudo ln -sf /lib/x86_64-linux-gnu/libaio.so.1t64 /lib/x86_64-linux-gnu/libaio.so.1

      - name: Install Oracle Instant Client
        run: |
          # Download Oracle Instant Client
          mkdir -p /opt/oracle
          cd /opt/oracle
          wget https://download.oracle.com/otn_software/linux/instantclient/2326300/instantclient-basic-linux.x64-23.26.3.0.0.zip
          wget https://download.oracle.com/otn_software/linux/instantclient/2326300/instantclient-sdk-linux.x64-23.26.3.0.0.zip

          # Unzip
          sudo unzip -o instantclient-basic-linux.x64-23.26.3.0.0.zip -d /opt/oracle
          sudo unzip -o instantclient-sdk-linux.x64-23.26.3.0.0.zip -d /opt/oracle

          # Set environment variables
          echo "LD_LIBRARY_PATH=/opt/oracle/instantclient_23_26:$LD_LIBRARY_PATH" >> $GITHUB_ENV
          echo "/opt/oracle/instantclient_23_26" >> $GITHUB_PATH

      - name: Verify Docker access for Testcontainers
        run: |
          docker --version
          docker ps

      # On 3.14t, packages without free-threaded wheels (polars-runtime-32
      # above all) are built from source, which takes ~20 minutes. The uv
      # cache keeps those built wheels, so it must survive: saved only on main.
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: connectorx-python/uv.lock
          cache-suffix: ${{ matrix.python-version }}
          save-cache: ${{ env.SAVE_CACHE }}

      - uses: taiki-e/install-action@just

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"

      # connectorx-python is its own cargo workspace with its own target/.
      # 3.14 builds with coverage instrumentation, so it needs its own cache.
      # 3.15 and 3.14t build the same dependency tree uninstrumented (only
      # pyo3 differs per ABI), so they share one cache, saved by 3.15.
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          shared-key: ${{ matrix.python-version == '3.14' && 'python-coverage' || 'python' }}
          workspaces: connectorx-python -> target
          save-if: ${{ env.SAVE_CACHE == 'true' && matrix.python-version != '3.14t' }}

      # [tool.uv] package = false keeps uv sync from building the extension;
      # `just test-python` builds it once via maturin develop.
      - name: Install python dependencies
        run: just bootstrap-python

      # connectorx-python is its own Cargo workspace, so rust-lint's clippy
      # never sees it. --all-targets builds its benches/examples too, and
      # --locked fails on a stale connectorx-python/Cargo.lock. The lints don't
      # depend on the Python version, so one matrix entry is enough.
      - name: Clippy linting (connectorx-python)
        if: matrix.python-version == '3.15'
        working-directory: connectorx-python
        run: cargo clippy --locked --all-targets -- -D warnings

      # Measure the Rust code the Python tests exercise (connectorx and the
      # connectorx-python bindings). Only on 3.14: one instrumented build is
      # enough, and 3.14t would just report the same lines again.
      - name: Install cargo-llvm-cov
        if: matrix.python-version == '3.14'
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Instrument the extension build for coverage
        if: matrix.python-version == '3.14'
        working-directory: connectorx-python
        run: |
          # show-env single-quotes its values; $GITHUB_ENV wants them bare.
          cargo llvm-cov show-env | tr -d "'" >> "$GITHUB_ENV"
          cargo llvm-cov clean --workspace --profraw-only

      - name: Test python
        run: just test-python
        # Integration tests provision required services at test time via Testcontainers

      - name: Generate python coverage
        if: matrix.python-version == '3.14'
        working-directory: connectorx-python
        run: |
          # `just setup-python` builds with maturin develop --release.
          cargo llvm-cov report --release --lcov --output-path lcov-python.info
          {
            echo "### Rust coverage from the Python tests"
            echo '```text'
            cargo llvm-cov report --release --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload python coverage to Codecov
        if: matrix.python-version == '3.14'
        uses: codecov/codecov-action@v7
        with:
          files: connectorx-python/lcov-python.info
          flags: python-tests
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
