name: ci

on:
  pull_request:
    branches:
      - main
      - prerelease
  push:
    branches:
      - main

# A newer push to the same PR makes the running checks obsolete; main pushes
# always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl postgresql-client build-essential pkg-config libssl-dev git sqlite3 libsqlite3-dev mysql-client python3 python3-pip libkrb5-dev libclang-dev
          echo "Cache Version ${{ secrets.CACHE_VERSION }}"
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-rust-${{ secrets.CACHE_VERSION }}

      - uses: extractions/setup-just@v4

      - name: Is the code formatted?
        run: cargo fmt --all -- --check -q

      # --all also covers connectorx-cpp (not a default member); this used to
      # run in both python matrix jobs instead.
      - name: Clippy linting
        run: cargo clippy --features all --all

      - name: Check each feature gate
        run: just test-feature-gate

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run unit tests and generate coverage
        # Both this and the integration step below run under cargo-llvm-cov's
        # instrumented build the whole time (RUSTFLAGS never changes between
        # them), so despite two `just` invocations this is still one compile.
        run: |
          just coverage-unit
          {
            echo "### Rust unit test coverage"
            echo '```text'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run integration tests and generate coverage
        run: |
          just coverage-integration
          {
            echo "### Rust integration test coverage"
            echo '```text'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # test_db.rs leaks each testcontainers::Container (std::mem::forget), and
      # every pulled image (postgres, mysql, mssql, ...) stays on the runner's
      # disk too, so the images accumulate across coverage-unit +
      # coverage-integration within this same job. Stop/remove the leaked
      # containers (label filter matches only containers testcontainers
      # started), then prune now-unreferenced images to reclaim that space.
      - name: Clean up test containers and images
        if: always()
        run: |
          docker rm -f $(docker ps -aq --filter "label=org.testcontainers.managed-by=testcontainers") 2>/dev/null || true
          docker image prune -af

      - name: Upload unit coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov-unit.info
          flags: unit-tests
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload integration coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov-integration.info
          flags: integration-tests
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Test build docs
        run: cargo doc --no-deps --features all

  # release.yml ships wheels for Windows and macOS too, but the jobs above only
  # run on Linux. Run the unit tests (no databases needed) on those platforms
  # so a platform-specific break is caught before a release.
  rust-cross-platform:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ secrets.CACHE_VERSION }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Run unit tests
        run: cargo test --lib --features all

  python:
    runs-on: ubuntu-latest
    env:
      # Force disable the GIL on free-threading because of https://github.com/sqlalchemy/sqlalchemy/discussions/13256
      PYTHON_GIL: ${{ matrix.python-version == '3.14t' && '0' || '1' }}
    # Note: No 'container' - we run directly on the VM to access Docker for Testcontainers
    strategy:
      matrix:
        python-version: ["3.14", "3.14t"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
            python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl postgresql-client build-essential pkg-config libssl-dev openssl git sqlite3 libsqlite3-dev mysql-client libmysqlclient-dev libkrb5-dev libclang-dev libffi-dev libaio1t64

          # Create symlink for libaio.so.1 (Oracle expects libaio.so.1, but Ubuntu 24.04 provides libaio.so.1t64)
          sudo ln -sf /lib/x86_64-linux-gnu/libaio.so.1t64 /lib/x86_64-linux-gnu/libaio.so.1

      - name: Install Oracle Instant Client
        run: |
          # Download Oracle Instant Client
          mkdir -p /opt/oracle
          cd /opt/oracle
          wget https://download.oracle.com/otn_software/linux/instantclient/2326300/instantclient-basic-linux.x64-23.26.3.0.0.zip
          wget https://download.oracle.com/otn_software/linux/instantclient/2326300/instantclient-sdk-linux.x64-23.26.3.0.0.zip

          # Unzip
          sudo unzip -o instantclient-basic-linux.x64-23.26.3.0.0.zip -d /opt/oracle
          sudo unzip -o instantclient-sdk-linux.x64-23.26.3.0.0.zip -d /opt/oracle

          # Set environment variables
          echo "LD_LIBRARY_PATH=/opt/oracle/instantclient_23_26:$LD_LIBRARY_PATH" >> $GITHUB_ENV
          echo "/opt/oracle/instantclient_23_26" >> $GITHUB_PATH

      - name: Verify Docker access for Testcontainers
        run: |
          docker --version
          docker ps

      - uses: Gr1N/setup-poetry@v9
        with:
          poetry-version: "2.4.1"

      - uses: extractions/setup-just@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"

      # connectorx-python is its own cargo workspace with its own target/, which
      # the old cache never covered, so every run rebuilt the extension's whole
      # dependency tree from scratch. pyo3 builds differ per ABI (3.14 vs 3.14t),
      # hence the per-matrix key.
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-rust-${{ secrets.CACHE_VERSION }}
          key: python-${{ matrix.python-version }}
          workspaces: connectorx-python -> target

      - name: Cache venv
        uses: actions/cache@v6
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: ${{ runner.os }}-${{ matrix.python-version }}-venv-${{ secrets.CACHE_VERSION }}-${{ hashFiles('connectorx-python/poetry.lock') }}

      # --no-root: `just test-python` builds the extension via maturin develop;
      # letting poetry install the project as well compiled it a second time.
      - name: Install python dependencies
        working-directory: connectorx-python
        run: poetry install --no-root

      - name: Test python (mssql-tds)
        run: just test-python --mssql-driver=mssql-tds --deselect=connectorx/tests/test_mssql.py::test_mssql_driver_switch
        # Integration tests provision required services at test time via Testcontainers

      - name: Test python MSSQL (Tiberius)
        working-directory: connectorx-python
        run: poetry run pytest connectorx/tests/test_mssql.py --mssql-driver=tiberius --deselect=connectorx/tests/test_mssql.py::test_mssql_driver_switch -v -s

      - name: Test python MSSQL runtime switch
        working-directory: connectorx-python
        run: poetry run pytest connectorx/tests/test_mssql.py::test_mssql_driver_switch -v -s
