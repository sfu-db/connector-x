name: import-test

on:
  workflow_dispatch:
    inputs:
      indexUrl:
        description: "Index Url"
        required: true
        default: "https://test.pypi.org/simple/"
      version:
        description: "version"
        required: false
        default: ""

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-10.15, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64

      - name: Check which python we use
        run: |
          echo $(which python)

      - name: Install ConnectorX - POSIX
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          pip install numpy importlib-metadata

          version='${{ github.event.inputs.version }}'
          if [ -z $version ]
          then
            pip install --index-url ${{ github.event.inputs.indexUrl }} connectorx
          else
            pip install --index-url ${{ github.event.inputs.indexUrl }} connectorx==$version
          fi

      - name: Install ConnectorX - Windows
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
          pip install numpy importlib-metadata

          $version = '${{ github.event.inputs.version }}'
          if ($version) {
            pip install --index-url ${{ github.event.inputs.indexUrl }} connectorx==$version
          } else { 
            pip install --index-url ${{ github.event.inputs.indexUrl }} connectorx
          }

      - name: Import
        run: python -c "from connectorx import read_sql"

  databricks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download wheel
        env:
          INDEX_URL: ${{ inputs.indexUrl }}
          VERSION: ${{ inputs.version }}
        run: |
          requirement=connectorx
          if [[ -n "$VERSION" ]]; then
            requirement="connectorx==$VERSION"
          fi
          pip download --only-binary=:all: --no-deps \
            --index-url "$INDEX_URL" --dest wheels "$requirement"

      - name: Check wheel in Databricks 16.4
        run: bash scripts/check-databricks-wheel.sh wheels/*.whl
