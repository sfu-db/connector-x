name: release

on:
  workflow_dispatch:
  push:
    branches:
      - prerelease
      - release

jobs:
  linux:
    runs-on: ${{ matrix.platform.runs-on }}
    container: quay.io/pypa/manylinux_2_28_${{ matrix.platform.arch }}
    strategy:
      matrix:
        platform: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '[{"arch":"x86_64","runs-on":"ubuntu-latest"}]' || '[{"arch":"x86_64","runs-on":"ubuntu-latest"},{"arch":"aarch64","runs-on":"ubuntu-22.04-arm"}]') }}
        python-version:
          ${{ fromJSON(github.event_name == 'workflow_dispatch' && '[["cp312-cp312","3.12"]]' || '[["cp310-cp310","3.10"],["cp311-cp311","3.11"],["cp312-cp312","3.12"],["cp313-cp313","3.13"],["cp314-cp314","3.14"],["cp314-cp314t","3.14t"]]') }}
    steps:
      - uses: actions/checkout@v7

      - name: Set python version
        run: |
          echo "/opt/python/${{ matrix.python-version[0] }}/bin" >> $GITHUB_PATH

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
          target: aarch64-unknown-linux-gnu
          default: true

      - uses: extractions/setup-just@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: Gr1N/setup-poetry@v9
        with:
          poetry-version: "2.4.1"

      - name: Install tools
        run: |
          yum install -y epel-release
          yum install -y mysql-devel postgresql-devel freetds-devel krb5-libs clang-devel libffi-devel
          yum install -y openssl3-devel bison libverto-libev

      - name: Build portable Kerberos libraries
        run: |
          bash scripts/build-krb5.sh
          mkdir -p connectorx-python/connectorx/dependencies/licenses
          cp /opt/connectorx-krb5/share/licenses/* connectorx-python/connectorx/dependencies/licenses/

      - name: Setup project
        run: |
          just bootstrap-python-release

      - uses: PyO3/maturin-action@v1
        with:
          rust-toolchain: stable
          container: "off"
          command: build
          args: -m connectorx-python/Cargo.toml -i python --release --manylinux 2_28 --features integrated-auth-gssapi
          before-script-linux: |
            # If we're running on rhel centos, install needed packages.
            if command -v yum &> /dev/null; then
                yum update -y && yum install -y perl-core openssl openssl-devel pkgconfig libatomic

                # If we're running on i686 we need to symlink libatomic
                # in order to build openssl with -latomic flag.
                if [[ ! -d "/usr/lib64" ]]; then
                    ln -s /usr/lib/libatomic.so.1 /usr/lib/libatomic.so
                fi
            else
                # If we're running on debian-based system.
                apt update -y && apt-get install -y libssl-dev openssl pkg-config
            fi
        env:
          SQLITE3_STATIC: 1
          RUSTFLAGS: "-L native=/opt/connectorx-krb5/lib"
          LD_LIBRARY_PATH: /opt/connectorx-krb5/lib
          BINDGEN_EXTRA_CLANG_ARGS: "-I/opt/connectorx-krb5/include"

      - uses: actions/upload-artifact@v7
        with:
          name: "linux-${{matrix.platform.arch}}-${{ matrix.python-version[1] }}"
          path: connectorx-python/target/wheels/*.whl

  win-and-mac:
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["windows-latest", "macos-15-intel"]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t"]
        include:
          - os: "macos-15-intel"
            features: "--features integrated-auth-gssapi"
    steps:
      - uses: actions/checkout@v7

      - uses: ankane/setup-mysql@v1
        with:
          mysql-version: 8

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
          default: true

      - uses: extractions/setup-just@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: Gr1N/setup-poetry@v9
        with:
          poetry-version: "2.4.1"

      - name: Setup project
        run: |
          just bootstrap-python-release

      - uses: PyO3/maturin-action@v1
        with:
          rust-toolchain: stable
          maturin-version: v1.15.0
          command: build
          args: -m connectorx-python/Cargo.toml -i python --release ${{ matrix.features }}
        env:
          SQLITE3_STATIC: 1

      - uses: actions/upload-artifact@v7
        with:
          name: "${{ matrix.os }}-${{ matrix.python-version }}"
          path: connectorx-python/target/wheels/*.whl

  apple-arm:
    if: github.event_name == 'push'
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t"]
    steps:
      - uses: actions/checkout@v7

      - uses: ankane/setup-mysql@v1
        with:
          mysql-version: 8

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
          target: aarch64-apple-darwin
          default: true

      - uses: extractions/setup-just@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: Gr1N/setup-poetry@v9
        with:
          poetry-version: "2.4.1"

      - name: Setup project
        run: |
          just bootstrap-python-release

      - uses: PyO3/maturin-action@v1
        with:
          rust-toolchain: stable
          maturin-version: v1.15.0
          command: build
          args: -m connectorx-python/Cargo.toml --target aarch64-apple-darwin -i python --release  --features integrated-auth-gssapi
        env:
          SQLITE3_STATIC: 1

      - uses: actions/upload-artifact@v7
        with:
          name: "macos-arm-${{ matrix.python-version }}"
          path: connectorx-python/target/wheels/*.whl

  verify:
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    needs: [win-and-mac, linux]
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t"]
        os:
          [
            macos-15-intel,
            ubuntu-latest,
            windows-latest,
            ubuntu-22.04-arm,
            macos-latest,
          ]
        include:
          # override artifact-prefix for linux variants
          - os: "ubuntu-latest"
            artifact-prefix: "linux-x86_64"
          - os: "ubuntu-22.04-arm"
            artifact-prefix: "linux-aarch64"
          - os: "macos-latest"
            artifact-prefix: "macos-arm"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@v8
        with:
          name: "${{ matrix.artifact-prefix || matrix.os }}-${{ matrix.python-version }}"

      - run: |
          pip install *.whl
          python -c "import connectorx"

  verify-databricks:
    runs-on: ubuntu-latest
    needs: [linux]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8
        with:
          name: linux-x86_64-3.12
          path: wheels

      - name: Check wheel on ordinary Linux
        run: |
          pip install wheels/*.whl polars pyarrow
          python scripts/check-wheel-import.py wheels/*.whl --sqlite

      - name: Check wheel in Databricks 16.4
        run: bash scripts/check-databricks-wheel.sh wheels/*.whl

  upload:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [verify, verify-databricks]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8

      - name: Setup environment
        run: |
          tree .
          echo "/home/runner/.local/bin" >> $GITHUB_PATH

      - name: Install Twine
        run: |
          pip install twine
          pip install packaging -U

      - name: Upload to PyPI site
        if: github.ref == 'refs/heads/release'
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          for file in $(ls **/*)
          do
            twine upload --non-interactive -u __token__ -p $PYPI_TOKEN $file || continue
          done

      - name: Upload to PyPI test site
        if: github.ref == 'refs/heads/prerelease'
        env:
          PYPI_TEST_TOKEN: ${{ secrets.PYPI_TEST_TOKEN }}
        run: |
          for file in $(ls **/*)
          do
            twine upload --non-interactive --repository-url https://test.pypi.org/legacy/ -u __token__ -p $PYPI_TEST_TOKEN $file --verbose || continue
          done
