name: PR Code Coverage

# Keep reporting separate from CI as a security boundary. The pull_request
# workflow executes untrusted PR code and fork PRs receive a read-only token;
# workflow_run executes the trusted default-branch workflow and can safely get
# pull-requests: write. Never execute files from the PR checkout in this job.
on:
  workflow_run:
    workflows:
      - ci
    types:
      - completed

permissions: {}

jobs:
  coverage-report:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write

    steps:
      # The composite action must come from the default branch, not the PR.
      - name: Checkout trusted reporting action
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted

      - name: Checkout pull request
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          path: source

      - name: Fetch base branch
        working-directory: source
        run: git fetch origin "${{ github.event.workflow_run.pull_requests[0].base.ref }}"

      - name: Download coverage
        uses: actions/download-artifact@v5
        with:
          name: rust-unit-test-coverage
          path: coverage
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Build coverage summary
        working-directory: source
        env:
          BASE_REF: origin/${{ github.event.workflow_run.pull_requests[0].base.ref }}
        run: |
          pip install --quiet diff-cover
          python - <<'PY' >> "$GITHUB_ENV"
          import xml.etree.ElementTree as ET

          rate = float(ET.parse("../coverage/cobertura.xml").getroot().attrib["line-rate"])
          print(f"COVERAGE_PERCENTAGE={rate * 100:.1f}%")
          PY

          diff-cover ../coverage/cobertura.xml \
            --compare-branch="$BASE_REF" \
            --json-report=patch-coverage.json \
            --markdown-report=patch-coverage.md

          echo "PATCH_COVERAGE_PCT=$(jq -r '.total_percent_covered // "N/A"' patch-coverage.json)%" >> "$GITHUB_ENV"
          {
            echo "PATCH_COVERAGE_SUMMARY<<EOF"
            cat patch-coverage.md
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Comment coverage summary on PR
        uses: ./trusted/.github/actions/post-coverage-comment
        with:
          pr_number: ${{ github.event.workflow_run.pull_requests[0].number }}
          coverage_percentage: ${{ env.COVERAGE_PERCENTAGE }}
          patch_coverage_pct: ${{ env.PATCH_COVERAGE_PCT }}
          patch_coverage_summary: ${{ env.PATCH_COVERAGE_SUMMARY }}
          run_url: ${{ github.event.workflow_run.html_url }}
