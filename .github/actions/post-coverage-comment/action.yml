name: Post Coverage Comment
description: Posts a code coverage comment on a pull request

inputs:
  pr_number:
    description: Pull request number
    required: true
  coverage_percentage:
    description: Overall coverage percentage
    required: true
  patch_coverage_pct:
    description: Patch coverage percentage
    required: true
  patch_coverage_summary:
    description: Patch coverage summary markdown
    required: true
  run_url:
    description: GitHub Actions run URL
    required: true

runs:
  using: composite
  steps:
    - name: Post coverage comment
      uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
      with:
        header: Code Coverage Report
        number: ${{ inputs.pr_number }}
        message: |
          ## Code Coverage Report

          | Diff coverage | Overall coverage |
          |---:|---:|
          | **${{ inputs.patch_coverage_pct }}** | **${{ inputs.coverage_percentage }}** |

          ${{ inputs.patch_coverage_summary }}

          [View GitHub Actions run](${{ inputs.run_url }})
