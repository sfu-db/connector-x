[project]
name = "connectorx" # Target file name of maturin build
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/sfu-db/connector-x"
Repository = "https://github.com/sfu-db/connector-x"
Issues = "https://github.com/sfu-db/connector-x/issues"
Documentation = "https://sfu-db.github.io/connector-x/intro.html"

# Dev/CI environment only. maturin reads [project] when building wheels, so
# none of this ends up in the published metadata.
[dependency-groups]
dev = [
  "black>=21.4b0,<27",
  "clickhouse-sqlalchemy>=0.3.2,<0.4",
  "contexttimer>=0.3.3,<0.4",
  "dask[dataframe]>=2021.7.0,<2022; python_version < '3.15'",
  "docopt>=0.6.2,<0.7",
  "ipython>=7.31.1,<9",
  "maturin>=1.0,<2.0",
  "modin[dask]>=0.10.1; python_version < '3.15'",
  "numpy>=2.3; python_version < '3.15'",
  "numpy>=2.5.2; python_version >= '3.15'",
  "pandas>=2.3; python_version < '3.15'",
  "pandas>=3.0.6; python_version >= '3.15'",
  "polars>=1",
  "psycopg2-binary>=2.9,<3",
  "pyarrow>=22; python_version < '3.15'",
  "pyarrow>=26; python_version >= '3.15'",
  "pytest>=9,<10",
  "pytest-benchmark>=5.2,<6",
  "testcontainers[oracle-free,clickhouse]>=4.0,<5",
  "twine>=3.4.1,<8",
]

[tool.uv]
# Don't build the Rust extension on `uv sync`; `maturin develop --uv` installs it.
package = false
# 3.15 resolves separately from 3.11-3.14 (python_version markers in the dev
# group and below), so the <3.15 versions stay as before. On 3.15 these are
# the first releases with cp315 wheels. modin (pandas<2.4) and dask (<2022)
# can't be installed alongside pandas 3; their tests are env-gated anyway.
environments = ["python_version >= '3.11' and python_version < '3.16'"]
constraint-dependencies = [
  # zstd 1.5.7.3 (via clickhouse-sqlalchemy -> asynch) was yanked as "not thread safe".
  "zstd!=1.5.7.3",
  "oracledb>=26; python_version >= '3.15'",
  "psycopg2-binary>=2.9.13; python_version >= '3.15'",
  "cffi>=2.1.1; python_version >= '3.15'",
  "greenlet>=3.5.6; python_version >= '3.15'",
  "markupsafe>=3.0.4; python_version >= '3.15'",
  "msgpack>=1.2.3; python_version >= '3.15'",
  "ciso8601>=2.4.1; python_version >= '3.15'",
]

[tool.pytest.ini_options]
minversion = "9.0"
python_functions = "test_* bench_*"
# python_files = check_*.py
# python_classes = Check
# addopts = "-ra -q"
# testpaths = [
#   "tests",
#   "integration",
# ]

[build-system]
build-backend = "maturin"
requires = ["maturin>=1.0,<2.0"]

[tool.maturin]
include = [
    { path = "connectorx/*.so", format = "sdist"},
    { path = "connectorx/*.pyd", format = "sdist"},
    { path = "connectorx/dependencies/", format = "sdist"},
    { path = "LICENSE", format = "sdist"},
]
